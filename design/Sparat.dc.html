<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #e2b04a; text-decoration: none; } a:hover { color: #f0c469; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #17161a; color: #ece9e4; display: flex; flex-direction: column;">

  <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #1f1e23; border-bottom: 1px solid #2b2a31;">
    <span style="font-size: 18px; font-weight: 600;">Kvittoarkiv</span>
    <a href="#" style="font-size: 16px; min-height: 44px; display: flex; align-items: center;">Kvitton</a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 16px;">

    <div style="background: #1f1e23; border: 1px solid #2b2a31; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="display: flex; gap: 4px;">
          <div style="width: 48px; height: 64px; border-radius: 3px; background: #2b2a31; border: 1px solid #2b2a31;"></div>
          <div style="width: 48px; height: 64px; border-radius: 3px; background: #2b2a31; border: 1px solid #2b2a31;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <span style="font-size: 18px; font-weight: 600;">Kvittot är sparat</span>
          <span style="font-size: 13px; color: #8a837b;">2 bilder · i dag 17:41</span>
        </div>
      </div>

      <div style="height: 1px; background: #2b2a31;"></div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#83c99b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 13 4 4L15 8"/><path d="m11 13 4 4L24 8"/></svg>
          <span style="font-size: 16px; color: #ece9e4;">Bild 1 — i arkivet</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9d968d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 13 5 5L20 7"/></svg>
          <span style="font-size: 16px; color: #9d968d;">Bild 2 — skickas</span>
        </div>
      </div>
    </div>

    <p style="font-size: 16px; color: #9d968d; line-height: 1.55; margin: 0; padding: 0 4px;">Kvittot ligger kvar i telefonen tills servern kvitterat varje bild. Du behöver inte vänta — fotografera nästa när du vill.</p>

  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 24px; background: #1f1e23; border-top: 1px solid #2b2a31;">
    <button style="height: 56px; border: none; border-radius: 6px; background: #e2b04a; color: #17161a; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1e23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Fotografera nästa kvitto
    </button>
    <button style="height: 48px; border: 1px solid #3a3841; border-radius: 6px; background: #1f1e23; color: #ece9e4; font-size: 16px;">Jag är färdig</button>
  </div>

</div>
</x-dc>
</body>
</html>
