<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    a { color: #6b4a2f; text-decoration: none; }
    .rad { display: grid; grid-template-columns: 92px 1fr auto; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px solid #e2dccb; }
    .n { font-variant-numeric: tabular-nums lining-nums; }
    .datum { font-size: 13px; color: #8a7f68; }
    .butik { font-size: 15px; }
    .belopp { font-size: 15px; text-align: right; }
    .summarad { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; padding: 9px 0 0; border-top: 2px solid #2f2a20; margin-top: 4px; }
  </style>
</helmet>
<div style="width: 720px; height: 480px; background: #faf6ec; color: #2f2a20; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 40px 0; display: flex; align-items: baseline; gap: 12px;">
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em;">Kvitton</span>
    <span style="margin-left: auto; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7f68; font-family: ui-sans-serif, system-ui, sans-serif;">Augusti 2026</span>
  </div>

  <div style="height: 1px; background: #2f2a20; margin: 12px 40px 0;"></div>

  <div style="padding: 10px 40px 0; flex-grow: 1;">
    <div class="rad"><span class="datum n">29 aug</span><span class="butik">Coop Konsum</span><span class="belopp n">284,50</span></div>
    <div class="rad"><span class="datum n">26 aug</span><span class="butik">Bauhaus Kungens Kurva</span><span class="belopp n">4 218,50</span></div>
    <div class="rad"><span class="datum n">24 aug</span><span class="butik">Willys</span><span class="belopp n">612,00</span></div>
    <div class="rad"><span class="datum n">24 aug</span><span class="butik">Systembolaget</span><span class="belopp n">289,00</span></div>
    <div class="rad"><span class="datum n">21 aug</span><span class="butik">Pressbyrån</span><span class="belopp n">42,00</span></div>
    <div class="rad" style="border-bottom: none;"><span class="datum n">19 aug</span><span class="butik">Hornbach</span><span class="belopp n">1 426,45</span></div>

    <div class="summarad">
      <span></span>
      <span style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7f68; font-family: ui-sans-serif, system-ui, sans-serif;">Summa augusti</span>
      <span class="n" style="font-size: 17px; font-weight: 600; text-align: right;">6 872,45</span>
    </div>
  </div>

  <div style="padding: 12px 40px 18px; font-size: 12px; color: #8a7f68; font-family: ui-sans-serif, system-ui, sans-serif;">
    Kassabok — beloppet är huvudsaken, bilden ett klick bort
  </div>
</div>
</x-dc>
</body>
</html>
