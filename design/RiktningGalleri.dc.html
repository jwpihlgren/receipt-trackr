<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #3c6e57; text-decoration: none; }
    .kort { display: flex; flex-direction: column; gap: 6px; }
    .papper { height: 132px; background: #ffffff; border-radius: 2px; box-shadow: 0 1px 2px rgb(30 28 24 / 0.10), 0 6px 14px rgb(30 28 24 / 0.10); padding: 10px 9px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
    .l { height: 3px; background: #b9b1a6; border-radius: 1px; }
    .rubrik { height: 5px; background: #2a2621; border-radius: 1px; margin: 0 auto 3px; }
    .n { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 720px; height: 480px; background: #eeeae3; color: #2a2621; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 18px; flex-shrink: 0;">
    <span style="font-size: 15px; font-weight: 600;">Kvitton</span>
    <div style="margin-left: auto; height: 28px; width: 190px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; gap: 7px; padding: 0 12px; font-size: 12px; color: #7d7568;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d7568" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Sök
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 10px; padding: 0 18px 10px;">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #7d7568;">AUGUSTI 2026</span>
    <span class="n" style="margin-left: auto; font-size: 12px; color: #7d7568;">6 kvitton · 6 852,45 kr</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; padding: 0 18px;">
    <div class="kort"><div class="papper">
      <div class="rubrik" style="width: 56%;"></div><div class="l" style="width: 86%;"></div><div class="l" style="width: 72%;"></div>
      <div style="height: 1px; background: #ddd7cd; margin: 2px 0;"></div>
      <div class="l" style="width: 90%;"></div><div class="l" style="width: 66%;"></div><div class="l" style="width: 80%;"></div>
      <div style="height: 4px; width: 48%; background: #2a2621; margin: 3px 0 0 auto; border-radius: 1px;"></div></div>
      <div><div style="font-size: 12px; font-weight: 500;">Coop Konsum</div><div class="n" style="font-size: 12px; color: #7d7568;">284,50</div></div></div>

    <div class="kort"><div class="papper">
      <div class="rubrik" style="width: 62%;"></div><div class="l" style="width: 78%;"></div><div class="l" style="width: 88%;"></div>
      <div style="height: 1px; background: #ddd7cd; margin: 2px 0;"></div>
      <div class="l" style="width: 84%;"></div><div class="l" style="width: 70%;"></div><div class="l" style="width: 92%;"></div>
      <div style="height: 4px; width: 52%; background: #2a2621; margin: 3px 0 0 auto; border-radius: 1px;"></div></div>
      <div><div style="font-size: 12px; font-weight: 500;">Bauhaus</div><div class="n" style="font-size: 12px; color: #7d7568;">4 218,50</div></div></div>

    <div class="kort"><div class="papper">
      <div class="rubrik" style="width: 44%;"></div><div class="l" style="width: 90%;"></div><div class="l" style="width: 64%;"></div>
      <div style="height: 1px; background: #ddd7cd; margin: 2px 0;"></div>
      <div class="l" style="width: 76%;"></div><div class="l" style="width: 86%;"></div>
      <div style="height: 4px; width: 46%; background: #2a2621; margin: 3px 0 0 auto; border-radius: 1px;"></div></div>
      <div><div style="font-size: 12px; font-weight: 500;">Willys</div><div class="n" style="font-size: 12px; color: #7d7568;">612,00</div></div></div>

    <div class="kort"><div class="papper">
      <div class="rubrik" style="width: 66%;"></div><div class="l" style="width: 70%;"></div>
      <div style="height: 1px; background: #ddd7cd; margin: 2px 0;"></div>
      <div class="l" style="width: 88%;"></div><div class="l" style="width: 60%;"></div>
      <div style="height: 4px; width: 50%; background: #2a2621; margin: 3px 0 0 auto; border-radius: 1px;"></div></div>
      <div><div style="font-size: 12px; font-weight: 500;">Systembolaget</div><div class="n" style="font-size: 12px; color: #7d7568;">289,00</div></div></div>

    <div class="kort"><div class="papper" style="height: 132px; display: flex; align-items: center; justify-content: center; box-shadow: none; background: #e4dfd6; border: 1px dashed #c5bcae;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a1988a" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" opacity="0.4"/><path d="M12 3a9 9 0 0 1 9 9"/></svg></div>
      <div><div style="font-size: 12px; color: #7d7568;">Tolkas …</div></div></div>
  </div>

  <div style="margin-top: auto; padding: 12px 18px; font-size: 12px; color: #7d7568;">Galleri — kvittot är ett fotografi, inte en rad</div>
</div>
</x-dc>
</body>
</html>
