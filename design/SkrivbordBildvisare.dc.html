<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    a { color: #e2b04a; text-decoration: none; } a:hover { color: #f0c469; }
    .n { font-variant-numeric: tabular-nums; }
    .verktyg { height: 40px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 8px; background: #1f1e23; border: 1px solid #2b2a31; box-shadow: 0 8px 24px rgb(0 0 0 / 0.55); }
    .kn { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #ece9e4; }
    .kn-text { height: 32px; border-radius: 6px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; color: #ece9e4; }
    .delare { width: 1px; height: 20px; background: #2b2a31; margin: 0 4px; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #0e0d10; color: #ece9e4; position: relative; overflow: hidden;">

  <!-- Bilden i 1:1. Papperet är bredare än ytan, alltså syns bara mitten — det är
       vad zoomen är till för: läsa en rad som tolkningen läste fel. -->
  <div style="position: absolute; left: 50%; top: -120px; transform: translateX(-50%); width: 760px; background: #ffffff; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px;">
    <div style="height: 22px; width: 46%; background: #1b1917; margin: 0 auto 10px;"></div>
    <div style="height: 10px; width: 84%; background: #9b938a;"></div>
    <div style="height: 10px; width: 66%; background: #9b938a;"></div>
    <div style="height: 1px; width: 100%; background: #d8d3cc; margin: 8px 0;"></div>
    <div style="height: 10px; width: 92%; background: #9b938a;"></div>
    <div style="height: 10px; width: 78%; background: #9b938a;"></div>
    <div style="height: 10px; width: 88%; background: #9b938a;"></div>
    <div style="height: 10px; width: 71%; background: #9b938a;"></div>
    <div style="height: 10px; width: 83%; background: #9b938a;"></div>
    <div style="height: 1px; width: 100%; background: #d8d3cc; margin: 8px 0;"></div>
    <div style="display: flex; justify-content: space-between;">
      <div style="height: 18px; width: 22%; background: #1b1917;"></div>
      <div style="height: 18px; width: 30%; background: #1b1917;"></div>
    </div>
    <div style="height: 10px; width: 58%; background: #9b938a;"></div>
    <div style="height: 10px; width: 64%; background: #9b938a;"></div>
    <div style="height: 10px; width: 44%; background: #9b938a;"></div>
  </div>

  <div style="position: absolute; left: 20px; top: 26px; display: flex; align-items: center; gap: 10px;">
    <span class="n" style="font-size: 14px; color: #ece9e4; background: rgb(23 22 26 / 0.8); padding: 4px 10px; border-radius: 6px;">Bild 2 av 3</span>
  </div>

  <div style="position: absolute; right: 20px; top: 20px; display: flex; align-items: center; gap: 10px;">
    <div class="verktyg">
      <span class="kn" title="Zooma ut">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6"/></svg>
      </span>
      <span class="kn-text n" style="min-width: 52px; justify-content: center;">100 %</span>
      <span class="kn" title="Zooma in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>
      </span>
      <span class="delare"></span>
      <span class="kn" title="Vrid vänster">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9a6 6 0 0 1 6 6v1"/><path d="m3 8 4-4"/><path d="m3 8 4 4"/></svg>
      </span>
      <span class="kn" title="Vrid höger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8h-9a6 6 0 0 0-6 6v1"/><path d="m21 8-4-4"/><path d="m21 8-4 4"/></svg>
      </span>
      <span class="delare"></span>
      <span class="kn-text">Öppna originalet</span>
      <span class="delare"></span>
      <span class="kn" title="Stäng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
