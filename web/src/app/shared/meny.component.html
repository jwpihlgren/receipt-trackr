<button type="button" class="hamburgare" (click)="toggle()" [attr.aria-expanded]="open()" aria-label="Meny">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M3 12h18" /><path d="M3 18h18" /></svg>
</button>

@if (open()) {
  <div class="overlagg">
    <nav class="panel" aria-label="Meny">
      <div class="huvud">
        <strong>Kvittoarkiv</strong>
      </div>

      <!--
        Första gruppen är ytans egna skärmar. Telefonens uppladdningskö låg tidigare
        här även i datorläget, men den kön bor i telefonens egen webbläsare — på
        datorn var raden alltid tom och ledde till en skärm som inte hörde hemma där.
      -->
      <div class="grupp">
        @if (lage() === 'mobil') {
          <a routerLink="/telefon/kvitton" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l3 3v15l-3-2-2 2-2-2-2 2-2-2-3 2V3Z" /><path d="M8 8h8" /><path d="M8 12h8" /><path d="M8 16h4" /></svg>
            <span>Kvitton</span>
          </a>
          <a routerLink="/telefon/uppladdning" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
            <span>På väg till arkivet</span>
            @if (pavag() > 0) { <em class="bricka">{{ pavag() }}</em> }
          </a>
          @if (fast() > 0) {
            <a class="illa" routerLink="/telefon/uppladdning" (click)="close()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>
              <span>Kom inte fram</span>
              <em class="bricka farlig">{{ fast() }}</em>
            </a>
          }
        } @else {
          <a routerLink="/dator/kvitton" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l3 3v15l-3-2-2 2-2-2-2 2-2-2-3 2V3Z" /><path d="M8 8h8" /><path d="M8 12h8" /><path d="M8 16h4" /></svg>
            <span>Kvitton</span>
          </a>
          <a routerLink="/dator/aktivitet" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>
            <span>Aktivitet</span>
          </a>
        }
      </div>

      <div class="avdelare"></div>

      <div class="grupp">
        @if (lage() === 'mobil') {
          <a routerLink="/dator/kvitton" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8" /><path d="M12 17v4" /></svg>
            <span>Datorläge</span>
          </a>
        } @else {
          <a routerLink="/telefon/kvitton" (click)="close()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2" /><path d="M11 18h2" /></svg>
            <span>Telefonläge</span>
          </a>
        }
        <a routerLink="/dator/drift" (click)="close()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="7" rx="2" /><rect x="2" y="13" width="20" height="7" rx="2" /><path d="M6 7.5h.01" /><path d="M6 16.5h.01" /></svg>
          <span>Utrymme och drift</span>
        </a>
      </div>

      <div class="botten">
        <button type="button" (click)="logout()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /></svg>
          <span>Logga ut</span>
        </button>
      </div>
    </nav>

    <button type="button" class="skugga" (click)="close()" aria-label="Stäng menyn"></button>
  </div>
}
