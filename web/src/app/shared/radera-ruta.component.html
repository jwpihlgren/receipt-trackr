<!--
  En riktig <dialog> med showModal(): Esc, fokusfälla och inert bakgrund kommer
  därifrån. Layouten hänger på DaisyUIs `modal`, som bär sitt eget villkor på [open].
-->
<dialog #rutan class="modal" (close)="avbrutet.emit()">
  <div class="modal-box">
    <h2 class="text-lg font-semibold">
      Ta bort {{ antal() }} {{ antal() === 1 ? 'kvitto' : 'kvitton' }}?
    </h2>
    <p class="mt-2 leading-relaxed">
      @if (tillagg(); as text) { {{ text }} }
      Bilderna, texten och allt du skrivit in försvinner för alltid. Det finns ingen
      papperskorg, och papperet är slängt.
    </p>

    <label class="label mt-4" for="radera-ord">Skriv <strong>radera</strong> för att bekräfta</label>
    <input
      id="radera-ord"
      class="input w-full"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      [value]="ordet()"
      (input)="skriv($event)"
      (keydown.enter)="bekrafta()"
    />

    <div class="modal-action">
      <button type="button" class="btn" (click)="stang()">Avbryt</button>
      <button type="button" class="btn btn-error" [disabled]="!ratt() || arbetar()" (click)="bekrafta()">
        @if (arbetar()) { <span class="loading loading-spinner loading-xs"></span> }
        Ta bort
      </button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button type="submit">Avbryt</button>
  </form>
</dialog>
