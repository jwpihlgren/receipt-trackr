# Uppgradering är hela vägen: `docker compose pull && docker compose up -d` (krav 53).
# Imagen byggs av GitHub vid varje push till master — ZimaBoarden bygger ingenting.
# `build` finns kvar för utveckling: `docker compose build` går fortfarande.
services:
  app:
    image: ghcr.io/jwpihlgren/receipt-trackr:latest
    build:
      context: .
      platforms: [linux/amd64]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Sätts bara när en katalog för säkerhetskopior är monterad nedan. Utan den
      # svarar backup-rutterna 503 med skälet, i stället för att låtsas fungera.
      BACKUP_DIR: /backup
      WEB_ROOT: /app/web/public
      PORT: "8080"
      # Vem som äger filerna i arkivet, sett från värden. Sätt till din egen användare
      # (`id -u` och `id -g`) om den inte är 1000, så går arkivet att läsa utan sudo.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Golvet för ledigt utrymme. Under det vägrar servern starta — se docs/DRIFT.md.
      MIN_FREE_BYTES: 5G
      LOG_LEVEL: info
    volumes:
      # Enda monteringen. Pekar mot ZFS-poolen, aldrig mot kortets eMMC: en
      # backloggkörning mot bootenheten fyller den och tar ner maskinen.
      - ${ARCHIVE_DIR:?ARCHIVE_DIR måste peka på en katalog i ZFS-poolen}:/data
      # Säkerhetskopior. Ska ligga på en annan disk än arkivet — en kopia på samma
      # disk skyddar mot misstag men inte mot att disken går sönder.
      - ${BACKUP_DIR:-./backup}:/backup
    ports:
      # Bara loopback: TLS termineras av `tailscale serve` på värden, och ingenting
      # ska nå appen förbi den vägen. Porten på värden är därför godtycklig — krockar
      # den med något annat, sätt HTTP_PORT i stället för att flytta den andra tjänsten.
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
